set timeout=5
set default=0
set gfxmode=1280x720x32
set gfxpayload=1280x720x32

# Load video & gfx modules first, then enable gfx terminal for theme rendering
insmod vbe
insmod gfxterm
insmod gfxmenu
insmod png
insmod jpeg
insmod font
terminal_output gfxterm

# Load fonts used by the theme (if present)
if [ -f /boot/grub/themes/teleport-abyss-1280x720/HY-WenHei-Extended-16.pf2 ]; then
    loadfont /boot/grub/themes/teleport-abyss-1280x720/HY-WenHei-Extended-16.pf2
fi
if [ -f /boot/grub/themes/teleport-abyss-1280x720/HY-WenHei-Extended-14.pf2 ]; then
    loadfont /boot/grub/themes/teleport-abyss-1280x720/HY-WenHei-Extended-14.pf2
    echo "Loaded font HY-WenHei-Extended-14.pf2"
fi

# Load theme (must come after gfx terminal and fonts are available)
if [ -f /boot/grub/themes/teleport-abyss-1280x720/theme.txt ]; then
    set theme=/boot/grub/themes/teleport-abyss-1280x720/theme.txt
    echo "Attempting to set theme: $theme"
else
    echo "GRUB theme not found"
fi

set timeout_style=menu

menuentry "GraceOS" {
    multiboot2 /boot/kernel.elf
    boot
}
